# 통합 API 게이트웨이 프로토타입 설정
# 수치를 바꾼 뒤 run.py 를 다시 실행하면 반영됩니다.

server:
  host: 127.0.0.1        # 다른 PC에서 접속하게 하려면 0.0.0.0
  gateway_port: 8000
  mock_port: 9000

admin_key: admin-41fcf6261e255ec5111ba30b   # 관리자 API 키 (시연용)

# 가상 플랫폼의 계정 키
# - gateway: 게이트웨이만 보관하는 키
# - direct : 직원들에게 공유된 키 (게이트웨이 없는 방식과 비교하기 위한 별도 계정)
mock_accounts:
  gateway: pk-gateway-7f3a9c2e51d84b06
  direct: pk-shared-91bc4d7a0e6f2358

# 게이트웨이 공통 정책
gateway:
  request_timeout_sec: 30     # 플랫폼 응답을 기다리는 최대 시간
  queue_max_wait_sec: 30      # 대기열에서 기다릴 수 있는 최대 시간
  queue_max_size: 100         # 플랫폼별 대기열 최대 길이
  retry:
    max_retries: 3
    backoff_sec: [0.5, 1, 2]  # 재시도 간격 (지수 백오프)
    max_retry_after_sec: 5    # 플랫폼이 이보다 오래 기다리라고 하면 재시도하지 않음
  circuit_breaker:
    failure_threshold: 4      # 연속 실패 횟수
    open_sec: 3               # 차단 유지 시간 (지나면 한 번 호출해서 복구 여부 확인)

# 직원 기본 정책
users:
  count: 50
  rate_per_minute: 60
  max_concurrent: 5
  daily_budget_krw: 3000

# 플랫폼 정의
#   platform_limit: 가상 플랫폼이 계정 키마다 강제하는 한도
#   gateway_limit : 게이트웨이가 스스로 지키는 한도
#                   보낸 시각과 플랫폼이 받은 시각 사이에 지연이 있으므로
#                   요청 수를 줄이거나 시간 창을 늘려 여유를 둔다
#   price         : 가상 단가 (시연을 위해 실제보다 높게 설정)
platforms:
  ai:
    name: AI 요약
    price: {per_1000_chars: 30}
    platform_limit: {max_concurrent: 3}
    gateway_limit: {max_concurrent: 3}
    latency_sec: [2.0, 3.0]
    error_rate: 0.0
    cache_ttl_sec: 3600
    coalesce: true

  biz:
    name: 거래처 조회
    platform_limit: {max_requests: 5, window_sec: 1}
    gateway_limit: {max_requests: 4, window_sec: 1.2}
    latency_sec: [0.05, 0.15]
    error_rate: 0.0
    cache_ttl_sec: 600
    coalesce: true

  translate:
    name: 번역
    price: {per_char: 0.1}
    platform_limit: {max_requests: 30, window_sec: 60}
    gateway_limit: {max_requests: 27, window_sec: 60}
    latency_sec: [0.3, 0.7]
    error_rate: 0.0
    cache_ttl_sec: 86400
    coalesce: true

  fx:
    name: 환율
    platform_limit: {max_requests: 100, window_sec: 86400}
    gateway_limit: {max_requests: 90, window_sec: 86400}
    latency_sec: [0.1, 0.3]
    error_rate: 0.0
    cache_ttl_sec: 3600
    coalesce: true

  ocr:
    name: 문서 OCR
    price: {per_call: 5}
    platform_limit: {max_requests: 2, window_sec: 1}
    gateway_limit: {max_requests: 2, window_sec: 1.3}
    latency_sec: [0.8, 1.2]
    error_rate: 0.1
    cache_ttl_sec: 0
    coalesce: false
